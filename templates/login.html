<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>登录 - AFS GPT</title>

  <link rel="icon" href="/favicon.ico?v=20260416" type="image/x-icon" />

  <link rel="icon" href="/brand-icon.png?v=20260416" type="image/png" sizes="64x64" />

  <link rel="stylesheet" href="/static/css/app.css?v=20260545" />

</head>

<body class="auth-page chatgpt-theme">

  <div class="auth-bg auth-bg-space auth-bg-boundary-sea" aria-hidden="true">
    <div class="auth-bg-aurora" aria-hidden="true"></div>
    <canvas class="auth-bg-canvas" id="auth-bg-canvas"></canvas>
    <div class="auth-bg-cursor" id="auth-bg-cursor"></div>
    <div class="auth-bg-vignette auth-bg-vignette-sea"></div>
    <div class="auth-bg-grain" aria-hidden="true"></div>
  </div>

  <div class="auth-card auth-card-glass">

    <h1>欢迎回来 Afs Agent</h1>

    <p class="muted">登录 Intelligent Agent · 对话与套图生成</p>

    <div id="auth-error" class="error hidden"></div>

    <form id="login-form">

      <label for="login-username">用户名</label>
      <div class="auth-glow-wrap">
        <input id="login-username" name="username" required autocomplete="username" />
      </div>

      <label for="login-password">密码</label>
      <div class="auth-glow-wrap">
        <input id="login-password" name="password" type="password" required autocomplete="current-password" />
      </div>

      <div class="auth-glow-wrap auth-glow-wrap-btn">
        <button type="submit">继续</button>
      </div>

    </form>

    <p class="auth-foot muted"><a class="auth-glow-link" href="/register/">没有账号？去注册</a></p>

  </div>

  <script src="/static/js/auth-bg-fallback.js?v=20260514"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "/static/vendor/three/build/three.module.js",
        "three/addons/": "/static/vendor/three/examples/"
      }
    }
  </script>
  <script type="module" src="/static/js/auth-bg.js?v=20260547"></script>
  <script src="/static/js/auth.js"></script>

</body>

</html>
